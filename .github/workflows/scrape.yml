name: Hourly Entur Scraper


on:
  schedule:
    - cron: "*/5 * * * *"  # Kjører hvert 5. minutt (UTC)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Sjekk ut kode
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer biblioteker
        run: pip install requests pandas tzdata 

      - name: Kjør scraper
        run: python vy_scraper.py

      - name: Lagre endringer til repo (Commit & Push)
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add *.csv
          git commit -m "Automatisk oppdatering av togtider" || echo "Ingen endringer å lagre"
          git push

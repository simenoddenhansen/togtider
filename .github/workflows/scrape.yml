name: Entur Scraper (hvert 30. minutt)

# Hindrer at to kjoringer kolliderer (f.eks. cron-job.org + GitHub schedule samtidig)
concurrency:
  group: scraper-run
  cancel-in-progress: true
on:
  # Primaer trigger: cron-job.org sender workflow_dispatch hvert 30. minutt.
  # Dette er langt mer paalitelig enn GitHub Actions schedule (som i praksis
  # dropper ~50% av kjoringene og har gjennomsnittlig 85 min mellomrom).
  workflow_dispatch:

  schedule:
    # Fallback: GitHub cron hver 2. time som sikkerhetsnett hvis cron-job.org er nede.
    # Primaertriggeren (cron-job.org) kjoerer hvert 30. minutt via workflow_dispatch.
    # GitHub Actions scheduler er best-effort og kan forsinke/droppe kjoringer,
    # saa denne fungerer kun som ekstra forsikring.
    - cron: "0 */2 * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Sjekk ut kode
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer biblioteker
        run: pip install requests pandas tzdata pytz

      - name: Kjør Oslo-Sandvika scraper
        run: python reiser_oslo_sandvika/vy_scraper.py

      - name: Oppdater stasjonsliste (hvis den mangler)
        run: |
          if [ ! -f data_collection/alle_stasjoner.csv ]; then
            python data_collection/hent_alle_stasjoner.py
          fi

      - name: Kjør landsdekkende forsinkelsesscraper
        run: python data_collection/forsinkelser_scraper.py --modes rail

      - name: Lagre endringer til repo (Commit & Push)
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add reiser_oslo_sandvika
          git add ruteData
          git add data_collection/alle_stasjoner.csv
          git add data_collection/forsinkelser_siste_kjoring.csv
          git add data_collection/history
          git commit -m "Automatisk oppdatering av togtider" || echo "Ingen endringer å lagre"
          git push

      - name: Arkiver historikk eldre enn 30 dager
        env:
          RETENTION_DAYS: 30
        run: |
          set -e

          # Sjekk ut gh-pages som worktree. Hvis branchen ikke finnes på remote,
          # opprett den som tom orphan-branch slik at første arkivering virker.
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add /tmp/archive gh-pages
          else
            git worktree add --detach /tmp/archive
            cd /tmp/archive
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
            cd "$GITHUB_WORKSPACE"
          fi

          python data_collection/archive_old_history.py \
            --history-dir data_collection/history \
            --archive-dir /tmp/archive \
            --retention-days "$RETENTION_DAYS"

          # Commit og push arkivendringer (gh-pages)
          cd /tmp/archive
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Arkiverer historikk eldre enn $RETENTION_DAYS dager"
            git push origin gh-pages
          else
            echo "Ingen nye arkivfiler å pushe."
          fi
          cd "$GITHUB_WORKSPACE"
          git worktree remove /tmp/archive --force

          # Commit og push sletting fra main
          if ! git diff --quiet -- data_collection/history; then
            git add data_collection/history
            git commit -m "Fjerner arkiverte historikkfiler eldre enn $RETENTION_DAYS dager"
            git push
          else
            echo "Ingen lokale historikkfiler ble fjernet."
          fi
